apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "user-secrets.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "user-secrets.selectorLabels" . | nindent 6 }}
