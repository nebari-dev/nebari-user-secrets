apiVersion: v1
kind: Service
metadata:
  name: user-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "user-secrets.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "user-secrets.selectorLabels" . | nindent 4 }}
  ports:
    - name: resolve
      port: 8443
      targetPort: 8443
    - name: management
      port: 8444
      targetPort: 8444
    - name: injector
      port: 9443
      targetPort: 9443
