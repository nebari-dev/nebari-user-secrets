# Management port (8444) from the landing frontend pods only. The resolve and
# injector ports are added with their servers in later slices.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "user-secrets.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "user-secrets.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.landing.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.landing.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8444
