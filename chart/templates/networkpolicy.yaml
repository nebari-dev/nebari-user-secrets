# Management port (8444) from the landing frontend pods only; resolve port
# (8443) from any pod in a registered workload namespace (the service verifies
# each caller's pod-bound token). The injector port is added with its server.
{{- $workloadNS := include "user-secrets.workloadNamespaces" . | fromJsonArray }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "user-secrets.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "user-secrets.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.landing.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.landing.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8444
    {{- if $workloadNS }}
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: {{ $workloadNS | toJson }}
      ports:
        - protocol: TCP
          port: 8443
    {{- end }}
