# Argo CD Application for the cluster bundle (cluster/: admission policies,
# their bindings and the service's cluster RBAC), built with kustomize as
# committed, so for the service namespace us-system. register-app.sh renders
# this file with envsubst; GITOPS_DIR is its only reference. Write no
# other dollar sign in this file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-secrets-cluster
  namespace: argocd
  annotations:
    # After the chart (user-secrets.yaml, wave 10).
    argocd.argoproj.io/sync-wave: "11"
spec:
  project: nebari-apps
  source:
    repoURL: "file://${GITOPS_DIR}"
    targetRevision: HEAD
    path: user-secrets-cluster
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: us-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
