# Argo CD Application for the chart, read by NIC's root App-of-Apps from
# apps/ of the local GitOps repository. test/journeys/register-app.sh renders
# this file with envsubst before committing it there, so every dollar-brace
# reference below is filled from the step's environment: GITOPS_DIR,
# USER_SECRETS_IMAGE and KEYCLOAK_ISSUER (set by the Tier 3 workflow;
# register-app.sh refuses an unset one). Write no other dollar sign in this
# file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-secrets
  namespace: argocd
  annotations:
    # Before user-secrets-cluster, which binds the creators ConfigMap this
    # chart renders.
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: nebari-apps
  source:
    repoURL: "file://${GITOPS_DIR}"
    targetRevision: HEAD
    path: user-secrets
    helm:
      releaseName: user-secrets
      # Copied into the chart directory by the workflow.
      valueFiles:
        - values-nebari.yaml
      valuesObject:
        # Built from the checkout and loaded into the kind node; the tag is
        # per commit, so the default pull policy is IfNotPresent.
        image: "${USER_SECRETS_IMAGE}"
        keycloak:
          issuers:
            - "${KEYCLOAK_ISSUER}"
  destination:
    server: https://kubernetes.default.svc
    namespace: us-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
