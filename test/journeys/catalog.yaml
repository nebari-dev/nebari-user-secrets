# Journey catalog: the single source for features, journeys, CI checks, tiers,
# statuses, test names and reasons. docs/ci/coverage.md is generated from it
# with `make coverage-doc`; the Tier 1 catalog test
# (test/journeys/catalog/catalog_test.go TestRepoCatalog) fails when a covered
# check names a test that does not exist in its tier, a gap has no reason, the
# journeys disagree with docs/design/user-secrets-spec.md, or coverage.md is
# stale.
#
# Tiers: 1 = unit and chart tests (no build tag); 2 = kind suite (build tags
# e2e and integration) and the policy matrix (run.sh:<section label> of
# test/policy/run.sh); 3 = real Nebari (build tag journeys). A not-covered check whose test would
# live in another repo has no tier.
#
# Statuses: covered (the named tests exist and run in that tier today);
# planned (the slice in `until` adds the test; counts as not covered);
# not-covered (CI cannot do it; `reason` says why, `until` what would change
# that). Feature IDs are stable: never renumber; retire instead.

features:
  - id: F1
    title: A user stores, rotates and deletes their own secrets through the management API, and never reads a value back
    source: "docs/design/user-secrets.md#goals (1)"
    status: active
  - id: F2
    title: Per-secret, per-app bindings; delivered names are always `NEBARI_SECRET_<SUFFIX>`
    source: "docs/design/user-secrets.md#goals (2)"
    status: active
  - id: F3
    title: Enabled secrets arrive at pod start as files, and optionally env vars, in notebooks, jhub-apps apps and Dask clusters
    source: "docs/design/user-secrets.md#goals (3), docs/design/user-secrets.md#delivery"
    status: active
  - id: F4
    title: Pod identity comes only from a registered creator, enforced by the API server; the service delivers nothing when it cannot confirm that
    source: "docs/design/user-secrets.md#goals (4), docs/design/user-secrets.md#pod-identity-and-the-admission-guard"
    status: active
  - id: F5
    title: A user can see per app when delivery last happened and why it last failed
    source: "docs/design/user-secrets.md#goals (5)"
    status: active
  - id: F6
    title: Values are encrypted per user under a rotatable master key; a lost master key stops delivery
    source: "docs/design/user-secrets.md#goals (6), docs/design/user-secrets.md#storage-and-encryption"
    status: active
  - id: F7
    title: Every value read and every denial is audited
    source: "docs/design/user-secrets.md#goals (7)"
    status: active
  - id: F8
    title: Any pack can consume secrets by meeting the consumer contract, with values only
    source: "docs/design/user-secrets.md#goals (8), docs/design/user-secrets.md#consumer-contract"
    status: active
  - id: F9
    title: Installing the service changes no existing workload
    source: "docs/design/user-secrets.md#goals (9)"
    status: active
  - id: F10
    title: The management API is reachable only from the landing page, inside the cluster
    source: "docs/design/user-secrets.md#threat-model, docs/design/user-secrets.md#architecture"
    status: active
  - id: F11
    title: Secrets survive restarts and upgrades of the service
    source: "docs/design/user-secrets.md#architecture"
    status: active
  - id: F12
    title: Sharing consequences are stated where the user shares
    source: "docs/design/user-secrets.md#threat-model"
    status: active

