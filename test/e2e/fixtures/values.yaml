# Chart values for the e2e release in namespace us-system. image is set by
# setup.sh from $IMG. keycloak points at the realm Keycloak serves in
# e2e-keycloak (fixtures/keycloak).
registry:
  apps:
    - id: jupyter
      workloads:
        - namespace: e2e-workload
          serviceAccount: default
  creators: []
keycloak:
  jwksURL: https://keycloak.e2e-keycloak.svc:8443/realms/nebari/protocol/openid-connect/certs
  issuers:
    - https://keycloak.e2e-keycloak.svc:8443/realms/nebari
  clientID: user-secrets-e2e
landing:
  namespace: nebari-system
  podSelector:
    app.kubernetes.io/name: nebari-landing
