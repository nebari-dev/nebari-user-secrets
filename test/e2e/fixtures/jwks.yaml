# Static JWKS server standing in for Keycloak's certs endpoint. It serves
# HTTPS with a certificate from NIC's nebari-ca-issuer for its Service names,
# so the service verifies it through its nebari-trust-bundle mount. The
# ConfigMap jwks-keys (jwks.json) is created by setup.sh from the test key
# generated into test/e2e/.tmp/.
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-keycloak
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jwks-tls
  namespace: e2e-keycloak
spec:
  secretName: jwks-tls
  issuerRef:
    kind: ClusterIssuer
    name: nebari-ca-issuer
  dnsNames:
    - jwks.e2e-keycloak.svc
    - jwks.e2e-keycloak.svc.cluster.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jwks-nginx
  namespace: e2e-keycloak
data:
  default.conf: |
    server {
      listen 8443 ssl;
      ssl_certificate /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      location = /jwks.json {
        root /usr/share/nginx/jwks;
        default_type application/json;
      }
      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwks
  namespace: e2e-keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jwks
  template:
    metadata:
      labels:
        app: jwks
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.7-alpine
          ports:
            - containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: 8443
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            - name: keys
              mountPath: /usr/share/nginx/jwks
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: jwks-nginx
        - name: tls
          secret:
            secretName: jwks-tls
        - name: keys
          configMap:
            name: jwks-keys
---
apiVersion: v1
kind: Service
metadata:
  name: jwks
  namespace: e2e-keycloak
spec:
  selector:
    app: jwks
  ports:
    - name: https
      port: 443
      targetPort: 8443
